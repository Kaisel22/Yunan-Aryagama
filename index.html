<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Yunan Aryagama</title>
    
    <!-- Memuat Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Memuat Three.js untuk Animasi 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505; /* Warna dasar gelap */
            color: #ffffff;
            overflow-x: hidden;
        }
        
        /* Efek Glassmorphism (Kaca Buram) */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Teks Gradasi */
        .gradient-text {
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Container untuk canvas 3D */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1; /* Berada di belakang konten */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">

    <!-- Latar Belakang 3D Canvas -->
    <div id="canvas-container"></div>

    <nav class="fixed top-0 w-full z-50 glass px-6 md:px-20 py-4 flex justify-between items-center transition-all">

            <a href="#projek" class="hover:text-blue-400 transition">Portofolio</a>
            <a href="#kontak" class="hover:text-blue-400 transition">Kontak</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="beranda" class="min-h-screen flex flex-col justify-center items-start px-6 md:px-20 pt-20">
